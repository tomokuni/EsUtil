# ビルドワークフロー
#
# 実行契機は次のとおり（**フル検証は Pull Request の 1 回だけ**）。
#   main 向け Pull Request … フル検証（唯一のゲート。 必須チェックは `ci`）
#   手動実行（workflow_dispatch） … 任意のブランチで確認する場合に使用する
#
# **push では実行しない**。 `main` へ入るのは Pull Request だけであり（ruleset）、Pull Request の検証は
# **マージ後に `main` へ載るツリーそのもの**（`refs/pull/<番号>/merge`）を対象にする。 同じツリーを
# マージ後にもう一度検証しても結果は変わらないため、`dev` への push と `main` への push では実行しない
# （実測 2026-11-02: 1 変更あたり最大 3 回、windows ランナー 5 本ずつ走っていた）。
# 作業ブランチで早く壊れを見つけたいときは、手元の `.github/verify/verify.ps1` か workflow_dispatch を使う。
#
# **変更のあったソリューションだけを検証する**（paths フィルタ）。
# 共通基盤（`EsUtil/`）・ビルド設定・スクリプト・文書を変えたときは 5 本すべてを検証する。
# 検証の中身は .github/verify/verify.ps1 が単一所有し、合否基準は .github/検証手順.md が定める。
#
# **ジョブは同時に走らせる**（直列だと 1 ジョブ 8 分だった。 実測 2026-10-26）。
#   verify … ソリューションごとに 1 ジョブ（マトリクス）。 ビルドとテスト（走査とリポジトリ全体の検査は除く）
#   package … 配布物の検証と SBOM（`verify` の後。 パッケージへ影響する変更のときだけ。 `ci` には入れない）
#   repo   … リポジトリ全体の検査と NuGet の監査（5 ジョブで繰り返さず、ここで 1 回だけ実行する）
#   docs   … 文書とコードの走査（復元もビルドも要らない。 ubuntu で走らせる）
# ソリューションは互いに独立しているため、分けても検証の意味は変わらない（壁時計は最も遅い 1 本になる）。
#
# **配布物（パッケージ）は本ワークフローで作る**（`verify` が Release ビルドの出力から
# `dotnet pack --no-build` で作り、`package` ジョブが `pack.yml`（再利用可能ワークフロー）を呼んで
# 集めて検証と SBOM を行う。 同じ `pack.yml` を `release.yml` も自分の実行から呼ぶ）。
# 以前は DryRun（release.yml）の `pack` ジョブが同じツリーを全 5 ソリューション分ビルドし直しており、
# 二重のビルドになっていた（実測 2026-11-06: pack ジョブ 213 秒 = 復元 42 / 作成 114 / 検証 14 / SBOM 10）。
# **パッケージへ影響しない変更（文書・workflow・テストだけ）では作らない**（`changes` の `packaging`）。
# `package` ジョブは `ci` の needs に**入れない**（必須チェックを遅らせない。 扱いは .github/RELEASE.md §4.2）。
#
# .NET SDK のバージョンはリポジトリルートの global.json が単一所有する（ワークフローでは指定しない）。
# .NET SDK のバージョンはリポジトリルートの global.json が単一所有する（ワークフローでは指定しない）。
# **ランナー イメージには .NET 11 SDK がまだ含まれないため、actions/setup-dotnet で導入する**
# （実測 2026-11-13: `windows-2025` のイメージは 10.0.4xx まで。 版は global.json から読む）。
# キャッシュは NuGet の復元と npm（markdownlint）だけを対象にする。
#
# **ビルドとテスト、リポジトリ全体の検査は windows-latest**（Win32 API の P/Invoke と、Windows 向けの
# 復元を伴う NuGet の監査を含む）、**文書の走査だけは ubuntu-latest**（OS に依存しない）。
#
# README の「build」バッジは `?event=pull_request` を指定する（既定は**既定ブランチの最新実行**であり、
# push では実行しないため、`dev` の古い push の結果が残って Pull Request の失敗を表示できない）。
name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一ブランチの古い実行は打ち切る（バッジは最新の実行結果を表示する）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. 変更のあったソリューションを決める
  # ────────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      solutions: ${{ steps.plan.outputs.solutions }}
      # **パッケージへ影響する変更か**（配布物を作るか。 release.yml の `pack` はこの結果に依存する）
      packaging: ${{ steps.plan.outputs.packaging }}
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
        with:
          # 変更の判定に全履歴を使う
          fetch-depth: 0

      # 変更の判定は git の差分だけを使う（追加のアクションに依存しない）。
      # 判定できない場合（手動実行・base が取れない場合）は**すべて**を対象にする（取りこぼしを避ける）。
      - name: 変更のあったソリューションを決める
        id: plan
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'

          # core.quotepath=false: 日本語のファイル名を \342\200\246 の形で引用させない（引用されると
          # 先頭の .github/ が一致せず、リポジトリ全体の変更を取りこぼす。 実測 2026-10-27）。
          # **取れなければ空を返す**（空は「すべて対象」として扱う。 取りこぼして検証を飛ばすより安全）。
          # 差分が取れたかどうかは $script:diffAvailable で下へ伝える（空と「取れなかった」を区別する。
          # 区別しないと、文書だけの変更（差分は取れたが対象 0 件）を「すべて対象」と誤判定する）。
          $script:diffAvailable = $false
          function Get-ChangedFiles {
            # 差分を取るのは Pull Request だけである（手動実行はすべてを対象にする）
            if ($env:EVENT_NAME -ne 'pull_request' -or -not $env:BASE_REF) { return @() }

            git fetch --no-tags origin $env:BASE_REF 2>&1 | Out-Null
            $out = @(git -c core.quotepath=false diff --name-only "origin/$($env:BASE_REF)...$env:HEAD_SHA" 2>&1)

            if ($LASTEXITCODE -ne 0) {
              Write-Host "git diff が終了コード $LASTEXITCODE で失敗しました（すべてを対象にします）"
              return @()
            }
            $script:diffAvailable = $true
            return $out
          }

          $solutions = [ordered]@{
            'EsUtil'               = 'EsUtil/EsUtil.slnx'
            'EsUtil.Ui.AvaloniaUI' = 'EsUtil.Ui.AvaloniaUI/EsUtil.Ui.AvaloniaUI.slnx'
            'EsUtil.Ui.MewUI'      = 'EsUtil.Ui.MewUI/EsUtil.Ui.MewUI.slnx'
            'EsUtil.Ui.WinUI3'     = 'EsUtil.Ui.WinUI3/EsUtil.Ui.WinUI3.slnx'
            'EsUtil.Ui.WinForms'   = 'EsUtil.Ui.WinForms/EsUtil.Ui.WinForms.slnx'
          }

          $changed = @(Get-ChangedFiles)

          # **文書（.md）だけの変更ではビルドもテストも要らない**（実測 2026-10-27: 文書だけの変更に
          # 8 分かけていた）。 文書の検査は docs ジョブ（verifyDocs.ps1）が持つ。
          $code = @($changed | Where-Object { $_ -notmatch '\.md$' })
          $repoWide = ($changed.Count -eq 0) -or (@($code | Where-Object {
                $_ -match '^(Directory\.|buildScript/|\.github/|global\.json|NuGet\.config|\.editorconfig|\.gitattributes)'
              }).Count -gt 0)

          $targets = @()
          if ($repoWide -or @($code | Where-Object { $_ -match '^EsUtil/' }).Count -gt 0) {
            $targets = @($solutions.Values)
          }
          else {
            foreach ($group in $solutions.Keys) {
              if (@($code | Where-Object { $_ -like "$group/*" }).Count -gt 0) { $targets += $solutions[$group] }
            }
          }
          $targets = @($targets | Sort-Object -Unique)

          # 対象が無いときは `[]` を書く（空の配列をパイプすると何も出力されず、出力が空文字になる。
          # 空文字は `[]` と一致しないため、下流の if が「対象あり」と誤判定する。 実測 2026-10-27）
          $json = if ($targets.Count -eq 0) { '[]' } else { $targets | ConvertTo-Json -Compress -AsArray }
          "solutions=$json" >> $env:GITHUB_OUTPUT

          # **パッケージへ影響する変更があるか**（配布物を作るか）。 判定できないときは作る（安全側）。
          # 配布物の中身を変えうるファイルだけを見る（workflow や `.editorconfig` の変更では作らない）。
          # **SBOM の生成に使うツールの版**（`.config/dotnet-tools.json`）と、**配布する単位**
          # （`.github/release-config.json`）も対象にする（どちらも配布物の検証結果を変える。
          # ツールの版だけを変えた PR で SBOM の作成が検証されない、という指摘を実測で受けた）。
          # **判定の所有者はここ**（release.yml はこの結果を使わず、成果物の有無で判断する）。
          $packagingPatterns = '^(Directory\.Packages\.props|Directory\.Build\.(props|targets)|NuGet\.config|global\.json|\.config/dotnet-tools\.json|\.github/release-config\.json|buildScript/(pack|generateSbom|verifyPackaging)\.ps1|.*\.csproj|.*/packages\.lock\.json|EsUtil[^/]*/.*/src/)'
          $packaging = $true
          if ($script:diffAvailable) {
            $files = @($changed | Where-Object { $_ -notmatch '\.md$' })
            $packaging = (@($files | Where-Object { $_ -match $packagingPatterns }).Count -gt 0)
          }
          "packaging=$($packaging.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          Write-Host "対象のソリューション: $($targets -join ', ')"
          Write-Host "パッケージへ影響する変更: $packaging"

  # ────────────────────────────────────────────────────────────
  # 2. 検証（verify.ps1 が単一所有する）
  # ────────────────────────────────────────────────────────────
  # **ソリューションごとに 1 ジョブ**にする（マトリクス）。 ローカルでは 1 プロセスで順に検証するが、
  # 5 本を直列に回すと CI で 8 分かかっていた（実測 2026-10-26）。 ソリューションは互いに独立している
  # （共通基盤を ProjectReference で持つだけ）ため、ジョブを分ければ**壁時計は最も遅い 1 本**になる。
  # 走査とパッケージングは別ジョブへ出し、3 ジョブを同時に走らせる（同じ検査を 2 回走らせない）。
  verify:
    needs: changes
    if: needs.changes.outputs.solutions != '[]'
    strategy:
      # 1 本が落ちても他を最後まで走らせる（どのソリューションが壊れたかを 1 回で全部見る）
      fail-fast: false
      matrix:
        # 対象が無いときも 1 件（"(none)"）にして、空のマトリクスで失敗しないようにする（上の if でスキップする）
        solution: ${{ fromJSON(needs.changes.outputs.solutions != '[]' && needs.changes.outputs.solutions || '["(none)"]') }}
    runs-on: windows-latest
    # テストが停止した場合に 6 時間（既定）待たないための上限
    timeout-minutes: 60
    name: verify (${{ matrix.solution }})
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      # .NET SDK は global.json が単一所有する（ランナー イメージには .NET 11 SDK がまだ無い。 パッケージの対象は net10.0 のまま）。
      - name: .NET SDK を導入
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # パッケージの対象は net10.0 のため、apphost / targeting pack を提供する .NET 10 SDK も入れる
      # （ビルドに使う SDK は global.json の 11.0.100。 実測 2026-11-13: 11 だけでは net10 の apphost が
      #  見つからず MSB3030 で失敗する）。
      - name: .NET 10 SDK を導入（net10 の apphost）
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # NuGet のグローバル パッケージ フォルダは**ソリューションごと**にキャッシュする。
      # 5 ジョブが同時に走るため、共通の大きなキャッシュ（実測 1.45 GB）を 5 重に復元すると
      # 1 ジョブあたり 43 秒かかり、ディスクも 7 GB を超える。 ソリューションごとに分けると
      # 復元量が必要な分だけになる（キーの識別子は `.slnx` の内容のハッシュ。 変更しても
      # restore-keys で同じソリューションの直前のキャッシュへ戻る）。
      # **2 つ目の識別子は「取得するパッケージの集合」で決める**（`packages.lock.json` と
      # `Directory.Packages.props`）。 `**/*.csproj` を混ぜると、パッケージが変わらない変更でも
      # キーが変わり、キャッシュを保存し直す（実測 2026-11-05: 復元 28〜35 秒）。
      - name: NuGet をキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles(matrix.solution) }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ hashFiles(matrix.solution) }}-

      # 検証は .github/verify/verify.ps1 が単一所有する（合否基準は .github/検証手順.md が所有者）。
      # 走査（-SkipDocs）・パッケージング（-SkipPackaging）・リポジトリ全体の検査（-SkipRepoChecks）・
      # NuGet の監査（-SkipPackage）は別ジョブが代表して 1 回だけ実行する（5 ジョブで同じ検査を
      # 繰り返さない。 実測 2026-11-05: 1 ジョブあたり 10〜30 秒の重複があった）。
      - name: 検証（Release）
        shell: pwsh
        run: |
          # -FullBuild: ゲートでは警告の取りこぼしを許さない（増分ビルドは前回の生成物を再利用するため、
          # 該当プロジェクトがスキップされて警告が隠れることがある。 規則は .github/検証手順.md §3）
          & './.github/verify/verify.ps1' -Configuration Release -Solution '${{ matrix.solution }}' -SkipDocs -SkipPackaging -SkipPackage -SkipRepoChecks -FullBuild
          if ($LASTEXITCODE -ne 0) { throw "検証が失敗しました（exit $LASTEXITCODE）" }

      # **配布物はここ（ビルドしたジョブ）で作る**（同じツリーを 2 回ビルドしない）。
      # `dotnet pack --no-build` は `--no-restore` を暗黙に含む（lock の一致は直前の検証の
      # `-p:RestoreLockedMode=true` が確かめている）。 パッケージへ影響しない変更では作らない。
      - name: パッケージを作成
        id: pack
        if: needs.changes.outputs.packaging == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $solution = '${{ matrix.solution }}'
          $out = Join-Path (Get-Location) 'nupkg'
          [void](New-Item -ItemType Directory -Path $out -Force)

          & dotnet pack $solution -c Release -o $out --nologo --no-build
          if ($LASTEXITCODE -ne 0) { throw "pack が失敗しました（$solution。 exit $LASTEXITCODE）" }

          $packages = @(Get-ChildItem -Path $out -File -Filter '*.nupkg')
          if ($packages.Count -eq 0) { throw "パッケージが作られていません（$solution）" }

          # 成果物の名前に使う製品名（ソリューション名）。 `package` ジョブが同じ名前を組み立てる
          "product=$([IO.Path]::GetFileNameWithoutExtension($solution))" >> $env:GITHUB_OUTPUT
          Write-Host "パッケージ: $($packages.Count) 件（$($packages.Name -join ', ')）"

      - name: パッケージを保管
        if: needs.changes.outputs.packaging == 'true'
        uses: actions/upload-artifact@v7
        with:
          # ソリューションごとに 1 つ（matrix の各ジョブが別の名前で上げ、`package` ジョブが集める）
          name: nupkg-${{ github.sha }}-${{ steps.pack.outputs.product }}
          path: |
            nupkg/**/*.nupkg
            nupkg/**/*.snupkg
          if-no-files-found: error
          overwrite: true

  # ────────────────────────────────────────────────────────────
  # 2a. 配布物の検証と SBOM（再利用可能ワークフロー `pack.yml` が単一所有する）
  # ────────────────────────────────────────────────────────────
  # **同じツリーを 2 回ビルドしない**: パッケージは `verify` が Release ビルドの出力から作り
  # （`dotnet pack --no-build`）、`pack.yml` は集めて検証するだけである。 変更の無かった
  # ソリューションの分だけ `pack.yml` が 1 本ずつ作り足す。
  # **検証するソリューションが 1 本も無い変更でも走らせる**（SBOM のツールの版や配布する単位だけの
  # 変更）。 そのとき `verify` は**スキップ**されるため、既定の `success()`（スキップを失敗と同じに扱う）
  # に任せると `package` もスキップされてしまう。 **「成功またはスキップ」を明示**し、失敗・キャンセルの
  # ときだけ止める。 スキップのときは `pack.yml` が**全ソリューションをこの実行で作る**。
  # **`ci` の needs には入れない**（必須チェックを遅らせない。 パッケージングの扱いは
  # .github/RELEASE.md §4.2 が定める）。
  package:
    needs: [changes, verify]
    if: "!cancelled() && needs.changes.result == 'success' && needs.changes.outputs.packaging == 'true' && (needs.verify.result == 'success' || needs.verify.result == 'skipped')"
    uses: ./.github/workflows/pack.yml
    with:
      # `verify` が作ったパッケージ（`nupkg-<sha>-<製品名>`）を集め、残りだけを作る（空なら全部作る）
      built-solutions: ${{ needs.changes.outputs.solutions }}

  # ────────────────────────────────────────────────────────────
  # 2b. リポジトリ全体の検査と NuGet の監査（ソリューションに依存しない。 verify と同時に走らせる）
  # ────────────────────────────────────────────────────────────
  # 5 本の verify ジョブで同じ検査を繰り返さないよう、ここで 1 回だけ実行する（-SkipRepoChecks で
  # matrix 側は省略している）。 ビルドとテストは要らないが、**NuGet の監査が復元（Windows 向けの
  # 参照パックを含む）を伴う**ため windows で走らせる（実測済みの環境だけを使う）。
  repo:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      # .NET SDK は global.json が単一所有する（ランナー イメージには .NET 11 SDK がまだ無い）
      - name: .NET SDK を導入
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # パッケージの対象は net10.0 のため、apphost / targeting pack を提供する .NET 10 SDK も入れる
      # （ビルドに使う SDK は global.json の 11.0.100。 実測 2026-11-13: 11 だけでは net10 の apphost が
      #  見つからず MSB3030 で失敗する）。
      - name: .NET 10 SDK を導入（net10 の apphost）
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # NuGet の監査は復元を伴う（パッケージの取得をキャッシュする。 キーは取得するパッケージの集合で決める）
      - name: NuGet をキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-repo-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-repo-
            nuget-${{ runner.os }}-

      # 合否基準は .github/検証手順.md（実装は .github/verify/verify.ps1 が単一所有する）
      - name: 検査と監査
        shell: pwsh
        run: |
          & ./.github/verify/verify.ps1 -SkipBuild -SkipTests -SkipDocs -SkipPackaging -SkipFormat
          if ($LASTEXITCODE -ne 0) { throw "リポジトリ全体の検査が失敗しました（exit $LASTEXITCODE）" }

  # ────────────────────────────────────────────────────────────
  # 2c. 文書とコードの走査（ビルドも復元も要らない。 verify と同時に走らせる）
  # ────────────────────────────────────────────────────────────
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      # .NET SDK は global.json が単一所有する（ランナー イメージには .NET 11 SDK がまだ無い）
      - name: .NET SDK を導入
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # パッケージの対象は net10.0 のため、apphost / targeting pack を提供する .NET 10 SDK も入れる
      # （ビルドに使う SDK は global.json の 11.0.100。 実測 2026-11-13: 11 だけでは net10 の apphost が
      #  見つからず MSB3030 で失敗する）。
      - name: .NET 10 SDK を導入（net10 の apphost）
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # markdownlint は npx で取る（毎回ダウンロードすると 2 分近くかかる。 実測 2026-10-26: 走査 125 秒）
      - name: npm をキャッシュ
        uses: actions/cache@v6
        with:
          # キャッシュの場所は OS で変わる（ubuntu は `~/.npm`）
          path: ~/.npm
          # 版は .github/verify/verifyDocs.ps1 が単一所有する（版を上げるとキーが変わる）
          key: npm-${{ runner.os }}-${{ hashFiles('.github/verify/verifyDocs.ps1', '.github/verify/markdownlint.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # 合否基準は .github/検証手順.md（実装は .github/verify/verifyDocs.ps1 が単一所有する）
      - name: 走査
        shell: pwsh
        run: |
          & ./.github/verify/verifyDocs.ps1
          if ($LASTEXITCODE -ne 0) { throw "走査が失敗しました（exit $LASTEXITCODE）" }

  # ────────────────────────────────────────────────────────────
  # 3. 必須チェックの受け皿
  # ────────────────────────────────────────────────────────────
  # 必須チェック（ruleset `Protect main`）は**このジョブ名**を要求する。
  # `verify` は条件（`if`）でスキップされ得るため、そのまま必須にするとスキップ時に
  # 「Expected」のまま残ってマージできなくなる。 常に走る集約ジョブで受ける。
  #
  # **`package`（配布物の検証と SBOM）はここに入れない**。 必須チェックを遅らせないためである
  # （ruleset が要求するのは `ci` だけ。 パッケージングの失敗はワークフローの失敗として見える）。
  ci:
    needs: [changes, verify, repo, docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 結果を集約
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          VERIFY: ${{ needs.verify.result }}
          REPO: ${{ needs.repo.result }}
          DOCS: ${{ needs.docs.result }}
        run: |
          echo "changes=$CHANGES verify=$VERIFY repo=$REPO docs=$DOCS"
          # スキップは「対象が無い」だけなので合格にする（verify は対象のソリューションが無い）
          for result in "$VERIFY" "$REPO" "$DOCS"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::検証が失敗しました（$result）"; exit 1
            fi
          done
          if [[ "$CHANGES" != "success" ]]; then
            echo "::error::変更の判定が失敗しました（$CHANGES）"; exit 1
          fi
