# ビルドワークフロー
#
# 実行契機は次のとおり。
#   main への push（マージ含む） … 必ず実行する
#   main 向け Pull Request       … 必ず実行する
#   dev への push                … 実行する（作業ブランチの確認）
#   手動実行（workflow_dispatch）  … 任意のブランチで確認する場合に使用する
#
# **変更のあったソリューションだけを検証する**（paths フィルタ）。
# 共通基盤（`EsUtil/`）・ビルド設定・スクリプト・文書を変えたときは 5 本すべてを検証する。
# 検証の中身は buildScript/verify.ps1 が単一所有し、合否基準は .github/検証手順.md が定める。
#
# **ジョブは 3 つを同時に走らせる**（直列だと 1 ジョブ 8 分だった。 実測 2026-10-26）。
#   verify    … ソリューションごとに 1 ジョブ（マトリクス）。 ビルドとテスト（走査とパッケージングは除く）
#   docs      … 文書とコードの走査（復元もビルドも要らない）
#   packaging … パッケージング（リポジトリ全体の設定を変えたときだけ）
# ソリューションは互いに独立しているため、分けても検証の意味は変わらない（壁時計は最も遅い 1 本になる）。
#
# .NET SDK のバージョンはリポジトリルートの global.json が単一所有する（ワークフローでは指定しない）。
# .NET SDK はランナー イメージに含まれる最新版をそのまま使う（actions/setup-dotnet を使わない）。
# キャッシュは NuGet の復元と npm（markdownlint）だけを対象にする。
#
# Windows 専用（Win32 API の P/Invoke を含む）のため windows-latest で実行する。
#
# README の「build」バッジはこのワークフローの status を表示する（badge.svg?branch=main）。
name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一ブランチの古い実行は打ち切る（バッジは最新の実行結果を表示する）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. 変更のあったソリューションを決める
  # ────────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      solutions: ${{ steps.plan.outputs.solutions }}
      packaging: ${{ steps.plan.outputs.packaging }}
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5
        with:
          # 変更の判定に全履歴を使う
          fetch-depth: 0

      # 変更の判定は git の差分だけを使う（追加のアクションに依存しない）。
      # 判定できない場合（初回 push・タグ・手動実行）は**すべて**を対象にする（取りこぼしを避ける）。
      - name: 変更のあったソリューションを決める
        id: plan
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-ChangedFiles {
            if ($env:EVENT_NAME -eq 'pull_request' -and $env:BASE_REF) {
              git fetch --no-tags origin $env:BASE_REF 2>$null | Out-Null
              # core.quotepath=false: 日本語のファイル名を \342\200\246 の形で引用させない（引用されると
              # 先頭の .github/ が一致せず、リポジトリ全体の変更を取りこぼす。 実測 2026-10-27）
              return @(git -c core.quotepath=false diff --name-only "origin/$($env:BASE_REF)...$env:HEAD_SHA")
            }
            if ($env:BEFORE_SHA -and $env:BEFORE_SHA -notmatch '^0+$') {
              return @(git -c core.quotepath=false diff --name-only "$($env:BEFORE_SHA)...$env:HEAD_SHA")
            }
            return @()
          }

          $solutions = [ordered]@{
            'EsUtil'               = 'EsUtil/EsUtil.slnx'
            'EsUtil.Ui.AvaloniaUI' = 'EsUtil.Ui.AvaloniaUI/EsUtil.Ui.AvaloniaUI.slnx'
            'EsUtil.Ui.MewUI'      = 'EsUtil.Ui.MewUI/EsUtil.Ui.MewUI.slnx'
            'EsUtil.Ui.WinUI3'     = 'EsUtil.Ui.WinUI3/EsUtil.Ui.WinUI3.slnx'
            'EsUtil.Ui.WinForms'   = 'EsUtil.Ui.WinForms/EsUtil.Ui.WinForms.slnx'
          }

          $changed = @(Get-ChangedFiles)
          $repoWide = ($changed.Count -eq 0) -or (@($changed | Where-Object {
                $_ -match '^(Directory\.|buildScript/|\.github/|global\.json|NuGet\.config|\.editorconfig|\.gitattributes)'
              }).Count -gt 0)

          $targets = @()
          if ($repoWide -or @($changed | Where-Object { $_ -match '^EsUtil/' }).Count -gt 0) {
            $targets = @($solutions.Values)
          }
          else {
            foreach ($group in $solutions.Keys) {
              if (@($changed | Where-Object { $_ -like "$group/*" }).Count -gt 0) { $targets += $solutions[$group] }
            }
          }
          $targets = @($targets | Sort-Object -Unique)

          # 対象が無いときは `[]` を書く（空の配列をパイプすると何も出力されず、出力が空文字になる。
          # 空文字は `[]` と一致しないため、下流の if が「対象あり」と誤判定する。 実測 2026-10-27）
          $json = if ($targets.Count -eq 0) { '[]' } else { $targets | ConvertTo-Json -Compress -AsArray }
          "solutions=$json" >> $env:GITHUB_OUTPUT
          "packaging=$($repoWide.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          Write-Host "対象のソリューション: $($targets -join ', ')"
          Write-Host "パッケージング検証: $repoWide"

  # ────────────────────────────────────────────────────────────
  # 2. 検証（verify.ps1 が単一所有する）
  # ────────────────────────────────────────────────────────────
  # **ソリューションごとに 1 ジョブ**にする（マトリクス）。 ローカルでは 1 プロセスで順に検証するが、
  # 5 本を直列に回すと CI で 8 分かかっていた（実測 2026-10-26）。 ソリューションは互いに独立している
  # （共通基盤を ProjectReference で持つだけ）ため、ジョブを分ければ**壁時計は最も遅い 1 本**になる。
  # 走査とパッケージングは別ジョブへ出し、3 ジョブを同時に走らせる（同じ検査を 2 回走らせない）。
  verify:
    needs: changes
    if: needs.changes.outputs.solutions != '[]'
    strategy:
      # 1 本が落ちても他を最後まで走らせる（どのソリューションが壊れたかを 1 回で全部見る）
      fail-fast: false
      matrix:
        # 対象が無いときも 1 件（"(none)"）にして、空のマトリクスで失敗しないようにする（上の if でスキップする）
        solution: ${{ fromJSON(needs.changes.outputs.solutions != '[]' && needs.changes.outputs.solutions || '["(none)"]') }}
    runs-on: windows-latest
    # テストが停止した場合に 6 時間（既定）待たないための上限
    timeout-minutes: 60
    name: verify (${{ matrix.solution }})
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5

      # .NET SDK はランナー イメージの最新版を使う（setup-dotnet は不要。イメージが C:\Program Files\dotnet を
      # PATH へ追加しているため、以降のステップでそのまま dotnet を実行できる）。
      # NuGet のグローバル パッケージ フォルダはキャッシュする（復元が最も時間を使う工程のため）。
      - name: NuGet をキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # 検証は buildScript/verify.ps1 が単一所有する（合否基準は .github/検証手順.md が所有者）。
      # 走査（-SkipDocs）とパッケージング（-SkipPackaging）は別ジョブが持つ。
      - name: 検証（Release）
        shell: pwsh
        run: |
          & './buildScript/verify.ps1' -Configuration Release -Solution '${{ matrix.solution }}' -SkipDocs -SkipPackaging
          if ($LASTEXITCODE -ne 0) { throw "検証が失敗しました（exit $LASTEXITCODE）" }

  # ────────────────────────────────────────────────────────────
  # 2b. 文書とコードの走査（ビルドも復元も要らない。 verify と同時に走らせる）
  # ────────────────────────────────────────────────────────────
  docs:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5

      # markdownlint は npx で取る（毎回ダウンロードすると 2 分近くかかる。 実測 2026-10-26: 走査 125 秒）
      - name: npm をキャッシュ
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\npm-cache
          # 版は buildScript/verifyDocs.ps1 が単一所有する（版を上げるとキーが変わる）
          key: npm-${{ runner.os }}-${{ hashFiles('buildScript/verifyDocs.ps1', 'buildScript/markdownlint.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # 合否基準は .github/検証手順.md（実装は buildScript/verifyDocs.ps1 が単一所有する）
      - name: 走査
        shell: pwsh
        run: |
          & pwsh -NoProfile -File buildScript/verifyDocs.ps1
          if ($LASTEXITCODE -ne 0) { throw "走査が失敗しました（exit $LASTEXITCODE）" }

  # ────────────────────────────────────────────────────────────
  # 2c. パッケージング（リポジトリ全体の設定を変えたときだけ。 verify と同時に走らせる）
  # ────────────────────────────────────────────────────────────
  packaging:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5

      - name: NuGet をキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # pack → 一時フィード → 一時コンシューマーで復元・ビルド・起動（規則は .github/検証手順.md §9）
      - name: パッケージング
        shell: pwsh
        run: |
          & pwsh -NoProfile -File buildScript/verifyPackaging.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw "パッケージングの検証が失敗しました（exit $LASTEXITCODE）" }
  # ────────────────────────────────────────────────────────────
  # 3. 必須チェックの受け皿
  # ────────────────────────────────────────────────────────────
  # 必須チェック（ruleset `Protect main`）は**このジョブ名**を要求する。
  # `verify` は条件（`if`）でスキップされ得るため、そのまま必須にするとスキップ時に
  # 「Expected」のまま残ってマージできなくなる。 常に走る集約ジョブで受ける。
  ci:
    needs: [changes, verify, docs, packaging]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 結果を集約
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          VERIFY: ${{ needs.verify.result }}
          DOCS: ${{ needs.docs.result }}
          PACKAGING: ${{ needs.packaging.result }}
        run: |
          echo "changes=$CHANGES verify=$VERIFY docs=$DOCS packaging=$PACKAGING"
          # スキップは「対象が無い」だけなので合格にする
          # （verify は対象のソリューションが無い / packaging はリポジトリ全体の変更が無い）
          for result in "$VERIFY" "$DOCS" "$PACKAGING"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::検証が失敗しました（$result）"; exit 1
            fi
          done
          if [[ "$CHANGES" != "success" ]]; then
            echo "::error::変更の判定が失敗しました（$CHANGES）"; exit 1
          fi
