# リリース ワークフロー
#
# 実行契機:
#   main 向け Pull Request … **dry-run を自動実行する**（配布物の作成と検証だけ。 公開もタグも作らない）
#   手動実行（workflow_dispatch）… mode=dry-run（作成と検証）または mode=release（公開とタグ付け）
#
# 手順の全体:
#   1. Pull Request の時点で dry-run が自動で走る（版・CHANGELOG・タグ・ブランチの検証、pack、SBOM）
#   2. 問題が無ければ main へマージし、**同じツリー**で mode=release を実行する

#      （**同じツリーの dry-run が成功していることを前提**にし、満たさなければ中止する）
#   3. release は「承認（environment: release）」→「公開」→「タグ付け」の順に進む
#
# 設計の要点:
#   - **版は人が Directory.Build.props の VersionPrefix へ書いてコミットしておく**（自動採番しない）。
#     入力 `version` は確認用であり、ツリーの値と一致しなければ失敗する。
#   - **CHANGELOG の見出しを公開前に確定させる**（`## 未リリース` が残っていれば失敗する。
#     公開した版の変更が「未リリース」のまま残らないようにする。 手順は .github/RELEASE.md）。
#   - **配布物は dry-run で 1 回だけ作り、release はそれを使う**（同じ内容を 2 回 pack しない）。
#     Pull Request の dry-run は**マージ後に main へ載るツリーそのもの**（`refs/pull/<番号>/merge`）を
#     検証するため、その成果物をそのまま公開できる（**コミットの SHA ではなくツリーで照合する**）。
#   - **公開が成功した後にだけタグを打つ**（公開できなかった版にタグを残さない）。
#   - **タグは 1 本**（`v<版>`。 すべてのパッケージが同じ版である）。 Release も 1 件にまとめる。
#   - **公開は Trusted Publishing**（OIDC で短命の API キーを取得する。 長期の API キーを持たない）。
#     ポリシーは「リポジトリ + ワークフロー ファイル + environment: release」に紐づける。
#   - **前回のタグから変更が無ければリリースしない**（版を上げていないだけの状態で空振りしない）。
#   - 公開する版にローカル識別子（`-`）を含めない。
#   - **配布物には SBOM（CycloneDX）を添付する**（ソリューションごとに 1 ファイル。 使った依存を公開物から辿れる）。
#   - **公開したパッケージには由来の証明（build provenance）を付ける**（どのワークフロー・どのコミットが
#     作ったかを後から検証できる。 `actions/attest-build-provenance`）。
#   - **実行できるブランチはモードで変わる**（dry-run は main / dev と main 向け Pull Request、公開は main のみ）。
#     一覧は .github/release-config.json が単一所有する（開発〜dry-run の確認は dev で行う）。
#
# **手順の所有者は .github/RELEASE.md**（本ファイルはその実装）。 版の規則は .github/ビルド設定規約.md §4、
# パッケージの合否基準は .github/検証手順.md §9 が持つ。
name: Release

# Pull Request では常に DryRun にする（`inputs.mode` は workflow_dispatch でしか入らない）
run-name: ${{ (github.event_name == 'pull_request' || inputs.mode == 'dry-run') && 'DryRun' || 'Release' }} ${{ github.ref_name }} ${{ github.sha }}

on:
  # **main 向け Pull Request では dry-run を自動実行する**（マージ後に手動で dry-run を回さない）。
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run（作成と検証のみ）/ release（公開とタグ付け）'
        required: true
        type: choice
        options: [dry-run, release]
        default: dry-run
      version:
        description: '任意: 公開する版（Directory.Build.props の VersionPrefix と一致しなければ失敗します）'
        required: false
        type: string

# 公開は同時に 1 つだけ、Pull Request の dry-run は PR ごとに並行してよい
# （`release` で直列にすると、PR の dry-run が公開の待ち行列へ入ってしまう）。
# Pull Request では、同じ PR へ新しいコミットが載ったら古い dry-run を打ち切る（無駄な pack を残さない）。
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. 前提検証（版・タグ・dry-run の成功）
  # ────────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # dry-run の実行結果の参照
      actions: read
    outputs:
      # 実行モード（Pull Request は常に dry-run）
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      count: ${{ steps.plan.outputs.count }}
      # pack / SBOM の対象（ソリューションと、SBOM の製品名）
      solutions: ${{ steps.plan.outputs.solutions }}
      # 検証した内容の識別子（ツリー）。 配布物の名前と、release の照合に使う
      tree: ${{ steps.plan.outputs.tree }}
      # dry-run の実行 ID（release はその成果物を使う。 同じ内容を 2 回 pack しない）
      dryRunId: ${{ steps.plan.outputs.dryRunId }}
      # パッケージへ影響する変更があるか（パッケージングの検証を実行するか）
      packaging: ${{ steps.plan.outputs.packaging }}
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
        with:
          # 前回のタグとの差分を取るため全履歴を取得する
          fetch-depth: 0

      # **Pull Request では常に dry-run**（`inputs.mode` は workflow_dispatch でしか入らない）。
      # これにより、PR の dry-run が公開へ進むことはない（公開は workflow_dispatch の release だけ）。
      - name: 実行モードを決める
        id: mode
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $mode = if ($env:EVENT_NAME -eq 'pull_request') { 'dry-run' } else { "$($env:INPUT_MODE)".Trim() }
          if ($mode -notin @('dry-run', 'release')) { throw "mode が不正です: '$mode'" }
          "mode=$mode" >> $env:GITHUB_OUTPUT
          Write-Host "実行モード: $mode（イベント: $($env:EVENT_NAME)）"

      # 公開した版の変更が「未リリース」のまま残らないようにする（規則は .github/RELEASE.md）。
      - name: CHANGELOG の見出しを検証する
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = [IO.File]::ReadAllLines('CHANGELOG.md', [Text.UTF8Encoding]::new($false))

          $unreleased = @($lines | Where-Object { $_ -match '^##\s+未リリース' })
          if ($unreleased.Count -gt 0) {
            throw "CHANGELOG.md に「$($unreleased[0])」が残っています。 見出しを「## <版>（<公開日>）」へ確定してコミットしてください（手順は .github/RELEASE.md）。"
          }

          # 版との一致は警告に留める（見出しの書き方は 1 つに決まらない）
          $first = @($lines | Where-Object { $_ -match '^## ' })[0]
          $props = [IO.File]::ReadAllText('Directory.Build.props', [Text.UTF8Encoding]::new($false))
          $version = [regex]::Match($props, '<VersionPrefix>([^<]+)</VersionPrefix>').Groups[1].Value.Trim()
          if ($version -and -not $first.Contains($version)) {
            Write-Host "::warning::CHANGELOG.md の先頭の見出し（$first）に版 $version が含まれていません。"
          }
          Write-Host "CHANGELOG の見出し: $first"

      - name: 実行ブランチを検証する
        shell: pwsh
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Pull Request は**マージ先**のブランチで判定する（`github.ref_name` は `19/merge` になる）
          $branch = if ($env:EVENT_NAME -eq 'pull_request') { $env:BASE_REF } else { $env:REF_NAME }

          # 許可ブランチの所有者は .github/release-config.json（ワークフローへ書き写さない）
          $config = Get-Content '.github/release-config.json' -Raw | ConvertFrom-Json
          $key = if ($env:MODE -eq 'release') { 'releaseBranches' } else { 'dryRunBranches' }
          $allowed = @($config.$key)

          if ($allowed.Count -eq 0) { throw ".github/release-config.json の $key が空です" }
          if ($allowed -notcontains $branch) {
            throw "このブランチ（$branch）では mode=$($env:MODE) を実行できません（許可: $($allowed -join ', ')。 .github/release-config.json）"
          }

          Write-Host "実行ブランチ: $branch（mode=$($env:MODE)、イベント: $($env:EVENT_NAME)）"

      - name: 版とタグを決める
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ steps.mode.outputs.mode }}
          INPUT_VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          $ErrorActionPreference = 'Stop'

          # 公開する単位（ソリューション）は .github/release-config.json が単一所有する。
          # 版はすべてのパッケージで 1 つである（所有者は Directory.Build.props。 規則は .github/ビルド設定規約.md §4）。
          $config = Get-Content '.github/release-config.json' -Raw | ConvertFrom-Json
          $list = @($config.solutions | ForEach-Object {
              [ordered]@{ product = [IO.Path]::GetFileNameWithoutExtension($_); solution = $_ }
            })
          $props = [IO.File]::ReadAllText('Directory.Build.props', [Text.UTF8Encoding]::new($false))
          $m = [regex]::Match($props, '<VersionPrefix>([^<]+)</VersionPrefix>')
          if (-not $m.Success) { throw 'Directory.Build.props に VersionPrefix がありません' }
          $version = $m.Groups[1].Value.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VersionPrefix が 3 桁の数値ではありません: $version" }

          # 公開する版にローカル識別子を含めない（取り消せない公開を守る）
          if ($version -match '-') { throw "VersionPrefix にローカル識別子が含まれています: $version" }
          if ($env:INPUT_VERSION -and $env:INPUT_VERSION.Trim() -ne $version) {
            throw "入力 $($env:INPUT_VERSION) が VersionPrefix $version と一致しません（版はコミット済みの値を使います）"
          }

          # タグは 1 本（`v<版>`）。 前回のタグからの変更が無ければリリースしない。
          $tag = "v$version"
          $lastTag = @(git tag --list 'v*' --sort=-v:refname) | Select-Object -First 1

          # 同じ版は再リリースできない（公開済みの版は不変）。 **dry-run では止めない**。
          # 版を上げていないだけの状態でも「それ以外の条件が通る」ことを確認できるようにする
          # （その確認が dry-run の役目。 公開（release）では失敗させる）。
          # 移行前の版グループ別タグ（`<グループ>/v<版>`）も「公開済み」と見なす（二重に公開しない）。
          $legacyTag = @(git tag --list "*/v$version") | Select-Object -First 1
          $alreadyReleased = ($lastTag -eq $tag) -or [bool]$legacyTag
          if ($alreadyReleased) {
            $reason = if ($legacyTag) { "タグ $legacyTag（移行前の版グループ別タグ）" } else { "タグ $tag" }
            if ($env:MODE -ne 'dry-run') {
              throw "$reason は既に存在します（同じ版を再リリースできません）。版を上げてコミットしてください。"
            }
            Write-Host "::warning::$reason は既に存在します。release モードでは失敗します（版を上げてください）。 dry-run のため続行します。"
          }

          $changed = if ($lastTag) { @(git diff --name-only "$lastTag...$($env:SHA)").Count -gt 0 } else { $true }
          if (-not $changed) { Write-Host "前回のタグ（$lastTag）から変更がありません（リリースしません）。" }

          # **パッケージへ影響する変更があるか**（パッケージングの検証を実行するかの判定）。
          # 配布物の中身を変えうるファイルだけを見る（workflow や .editorconfig の変更では検証しない）。
          # 判定できない場合（差分が取れない）は**実行する**（取りこぼして検証を飛ばすより安全）。
          $packagingPatterns = '^(Directory\.Packages\.props|Directory\.Build\.(props|targets)|NuGet\.config|global\.json|buildScript/(pack|generateSbom|verifyPackaging)\.ps1|.*\.csproj|.*/packages\.lock\.json|EsUtil[^/]*/.*/src/)'
          $packaging = $true
          $diffBase = ''
          if ($env:EVENT_NAME -eq 'pull_request' -and $env:BASE_REF) {
            # 比較の基準（base ブランチ）を取得する（checkout は既定で対象の ref だけを取る）
            git fetch --no-tags origin $env:BASE_REF 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) { $diffBase = "origin/$($env:BASE_REF)" }
          }
          elseif ($lastTag) { $diffBase = $lastTag }
          if ($diffBase) {
            $files = @(git -c core.quotepath=false diff --name-only "$diffBase...$($env:SHA)" 2>$null | Where-Object { $_ -notmatch '\.md$' })
            if ($LASTEXITCODE -eq 0) {
              $packaging = ($files.Count -gt 0) -and (@($files | Where-Object { $_ -match $packagingPatterns }).Count -gt 0)
            }
          }
          Write-Host "パッケージングの検証: $packaging"
          "packaging=$($packaging.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          # release は「**信頼できる dry-run** が同じ内容（ツリー）を検証している」ことを前提にする。
          # **成果物の名前だけを信用しない**（PR はワークフローの定義も変更できるため、任意のファイルを
          # `nupkg-<ツリー>` という名前で持ち込める）。 次の 2 つを満たす実行だけを採用する:
          #   1. **このリポジトリの実行**であること（`head_repository`。 fork の PR を除外する）
          #   2. **リリース元のブランチ**であること（Pull Request は `dev`、手動は許可ブランチ）
          # そのうえで**配布物の名前（ツリー）が一致**することを確かめる。
          # なお、同じリポジトリの書き込み権限を持つ利用者が PR を偽装することまでは防げない
          # （公開物の完全な証明が要る場合は配布物へ attestation を付けて検証する。 §10）。
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          $nupkgName = "nupkg-$tree"
          $dryRunId = ''
          if ($env:MODE -eq 'release') {
            $config = Get-Content '.github/release-config.json' -Raw | ConvertFrom-Json
            $manualBranches = @($config.dryRunBranches)

            # **全件を走査する**（固定件数で打ち切らない。 成功した dry-run が積み上がっても見失わない）
            $runs = @(gh api --paginate "repos/$($env:REPO)/actions/workflows/release.yml/runs?status=success&per_page=100" --jq '.workflow_runs[] | [(.id|tostring), .display_title, .event, .head_branch, (.head_repository.full_name // "")] | @tsv')
            $scanned = 0
            foreach ($line in $runs) {
              $fields = $line -split "`t"
              if ($fields.Count -lt 5) { continue }
              $id = $fields[0]; $title = $fields[1]; $event = $fields[2]; $branch = $fields[3]; $repo = $fields[4]

              if ($title -notlike 'DryRun*') { continue }
              $scanned += 1

              # 1. このリポジトリの実行だけを信頼する（fork の PR は成果物を持ち込める）
              if ($repo -ne $env:REPO) { continue }

              # 2. リリース元のブランチだけを信頼する
              $trusted = ($event -eq 'pull_request' -and $branch -eq 'dev') -or
                         ($event -eq 'workflow_dispatch' -and $manualBranches -contains $branch)
              if (-not $trusted) { continue }

              # 3. 配布物の名前（ツリー）が一致すること
              $names = @(gh api "repos/$($env:REPO)/actions/runs/$id/artifacts" --jq '.artifacts[].name')
              if ($names -contains $nupkgName) { $dryRunId = $id; break }
            }

            if (-not $dryRunId) {
              throw "この内容（ツリー $tree。 コミット $($env:SHA)）を検証した信頼できる dry-run がありません（成功した実行 $scanned 件を確認）。 dev からの Pull Request の DryRun を待つか、main で mode=dry-run を実行してください。"
            }
            Write-Host "dry-run の実行: $dryRunId（ツリー $tree が一致。 成果物 $nupkgName を再利用します）"
          }

          $json = $list | ConvertTo-Json -Compress -AsArray
          $count = if ($changed) { 1 } else { 0 }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "tree=$tree" >> $env:GITHUB_OUTPUT
          "solutions=$json" >> $env:GITHUB_OUTPUT
          "count=$count" >> $env:GITHUB_OUTPUT
          "dryRunId=$dryRunId" >> $env:GITHUB_OUTPUT
          Write-Host "版: $version（タグ $tag、対象 $($list.Count) ソリューション、リリース $count）"

  # ────────────────────────────────────────────────────────────
  # 2. 配布物の作成（dry-run だけが作る。 release は dry-run の成果物を使う）
  # ────────────────────────────────────────────────────────────
  pack:
    needs: verify
    if: needs.verify.outputs.mode == 'dry-run' && needs.verify.outputs.count != '0'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      # **キーは「取得するパッケージの集合」で決める**（`packages.lock.json` と `Directory.Packages.props`）。
      # `**/*.csproj` を混ぜると、パッケージが変わらない変更でもキーが変わり、1.45 GB のキャッシュを
      # 保存し直す（実測 2026-11-05: 復元 50 秒 / 保存 は復元より長い）。
      - name: NuGet をキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # 版はコミット済みの VersionPrefix を使う（ワークフローで書き換えない）。
      # ソリューションごとに pack する（1 つの版で全パッケージを作る。 ローカル識別子は付けない）。
      # **ソリューション同士は並列にしない**: UI ソリューションの ProjectReference は共通基盤を
      # 含まないため、同時に動かすと共有の `obj/Release` を奪い合って `GenerateDepsFile` が失敗する
      # （実測 2026-11-05: CI で再現）。 直列のままにする（手元の実測でも直列 19 秒に対し、
      # ソリューションごとに出力を隔離した並列は参照先の再ビルドが増えて遅い）。
      - name: パッケージを作成
        shell: pwsh
        env:
          SOLUTIONS: ${{ needs.verify.outputs.solutions }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path (Get-Location) 'artifacts'
          [void](New-Item -ItemType Directory -Path $out -Force)
          foreach ($item in @(ConvertFrom-Json $env:SOLUTIONS)) {
            # lock どおりに復元する（packages.lock.json と Directory.Packages.props の食い違いを NU1004 で検出する）
            & dotnet pack $item.solution -c Release -o $out --nologo -p:RestoreLockedMode=true
            if ($LASTEXITCODE -ne 0) { throw "pack が失敗しました: $($item.product)" }
          }

          $packages = @(Get-ChildItem -Path $out -File -Filter '*.nupkg')
          Write-Host "パッケージ: $($packages.Count) 件"
          if ($packages.Count -eq 0) { throw "パッケージが作られていません: $out" }

      # 配布物の正しさ（同封物・nuspec の依存・パッケージ参照での復元/ビルド/起動）を確かめる。
      # **公開する版のパッケージをそのまま検証する**（build.yml のパッケージングと同じ手順。
      # パッケージへ影響する変更のときだけ実行する）。
      - name: パッケージングを検証
        if: needs.verify.outputs.packaging == 'true'
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          & pwsh -NoProfile -File buildScript/verifyPackaging.ps1 -SkipPack -Feed artifacts -Version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "パッケージングの検証が失敗しました（exit $LASTEXITCODE）" }

      - name: 配布物を保管
        uses: actions/upload-artifact@v7
        with:
          # **名前へツリーを埋める**（release はこの名前で「同じ内容の dry-run」を探す）
          name: nupkg-${{ needs.verify.outputs.tree }}
          path: |
            artifacts/**/*.nupkg
            artifacts/**/*.snupkg
          if-no-files-found: error
          # **再実行で同じ名前へ上書きする**（既定は `false` で、失敗したジョブの再実行が
          # 「同じ名前の成果物がある」で失敗し、先へ進めない）。
          overwrite: true

  # ────────────────────────────────────────────────────────────
  # 2b. SBOM（CycloneDX）を作る（dry-run だけが作る。 release は dry-run の成果物を使う）
  # ────────────────────────────────────────────────────────────
  # **pack と並列に走らせる**（SBOM は配布物を使わない。 直列にすると作成の待ち時間が毎回乗る）。
  # `pack` と同じジョブへ統合する案は実測で捨てた（復元は pack が済ませているのに作成に 125 秒かかり、
  # 直列化でクリティカル パスが 218 秒 → 340 秒へ伸びた。 実測 2026-11-05）。
  # ソリューションごとに 1 ファイル作り、1 つの Release へまとめて添付する。
  sbom:
    needs: verify
    if: needs.verify.outputs.mode == 'dry-run' && needs.verify.outputs.count != '0'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      # 取得するのは **CycloneDX のツールだけ**（キーは `.config/dotnet-tools.json`）。
      # プロジェクトのパッケージも `~/.nuget/packages` へ入るが、キーを分けておくと
      # パッケージを変えていない限りツールの取得でキャッシュが総入れ替えにならない。
      - name: NuGet をキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-sbom-${{ hashFiles('.config/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-sbom-
            nuget-${{ runner.os }}-

      - name: SBOM を作成
        shell: pwsh
        env:
          SOLUTIONS: ${{ needs.verify.outputs.solutions }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          # ツールの版は .config/dotnet-tools.json が単一所有する（CI とローカルで同じものを使う）。
          # **復元は 1 回だけ**行う（並列に走らせると同じツール フォルダを取り合うため。 スクリプトへは
          # -SkipToolRestore を渡す）。
          & dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw "dotnet tool restore に失敗しました（exit $LASTEXITCODE）" }

          $root = (Get-Location).Path
          $output = Join-Path $root 'sbom'
          $version = $env:VERSION
          $items = @(ConvertFrom-Json $env:SOLUTIONS)

          # ソリューションごとに 1 つの SBOM を作る。 **互いに独立しているため並列に走らせる**
          # （1 つあたり 20 秒前後 × 5 本を直列に回すと 2 分近くかかっていた）。
          # 子プロセスの出力は**戻り値に混ぜず**、ログへ出す（混ざると結果の判定が壊れる）。
          $results = $items | ForEach-Object -Parallel {
            $item = $_
            $text = & pwsh -NoProfile -File (Join-Path $using:root 'buildScript/generateSbom.ps1') `
              -Output $using:output -Solution $item.solution -Version $using:version `
              -Product $item.product -SkipToolRestore *>&1
            $code = $LASTEXITCODE
            $text | ForEach-Object { Write-Host $_ }
            [pscustomobject]@{ Product = $item.product; Exit = $code }
          } -ThrottleLimit 5

          $failed = @($results | Where-Object { $_.Exit -ne 0 })
          if ($failed.Count -gt 0) {
            throw "SBOM の作成に失敗しました: $($failed.Product -join ', ')"
          }

          $made = @(Get-ChildItem -Path $output -File)
          $made | ForEach-Object { $_.Name }
          if ($made.Count -ne $items.Count) {
            throw "SBOM の件数がソリューションの数と一致しません（期待 $($items.Count) / 実際 $($made.Count)）"
          }

      - name: SBOM を保管
        uses: actions/upload-artifact@v7
        with:
          # 配布物と同じく、名前へツリーを埋める
          name: sbom-${{ needs.verify.outputs.tree }}
          path: sbom/*.json
          if-no-files-found: error
          # 再実行で同じ名前へ上書きする（配布物と同じ理由）
          overwrite: true

  # ────────────────────────────────────────────────────────────
  # 3. 公開（release のみ。 承認を要求する）
  # ────────────────────────────────────────────────────────────
  publish:
    needs: [verify]
    if: needs.verify.outputs.mode == 'release' && needs.verify.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 承認されたジョブだけが公開できる（Trusted Publishing のポリシーもこの環境に紐づける）
    environment: release
    permissions:
      contents: read
      # dry-run の実行の成果物を取得する
      actions: read
      # OIDC で短命の NuGet API キーを取得する
      id-token: write
    steps:
      # 配布物の検証が**リポジトリのプロジェクト一覧**（`git ls-files`）を読むため、チェックアウトする
      # （成果物の取得だけでは一覧が空になり、全パッケージが「想定外」と誤判定される。 実測 2026-11-03）。
      - name: チェックアウト
        uses: actions/checkout@v7

      # **dry-run が作った配布物をそのまま公開する**（同じ内容を 2 回 pack しない。
      # 検証したバイト列と公開するバイト列が一致する）。 Pull Request の dry-run も使える。
      # 成果物が失効している場合は失敗する。
      - name: 配布物を取得（dry-run の実行から）
        uses: actions/download-artifact@v8
        with:
          name: nupkg-${{ needs.verify.outputs.tree }}
          path: artifacts
          run-id: ${{ needs.verify.outputs.dryRunId }}
          github-token: ${{ github.token }}

      # 短命の API キーを取得する（1 時間有効。 1 トークン = 1 キー。 **push の直前に取得する**）
      - name: NuGet の API キーを取得
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # **配布物の中身を確かめる**（成果物の名前だけを信用しないための多重化）。
      # リポジトリのパッケージ（テスト・サンプルを除く全プロジェクト）と版が**過不足なく一致**し、
      # README と XML ドキュメントが同封されていることを確かめてから公開する。
      - name: 配布物を検証
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $issues = [System.Collections.Generic.List[string]]::new()

          $expected = @(git ls-files --cached --others --exclude-standard -- '*.csproj' |
              Where-Object { $_ -notmatch '\.(Tests|Sample|SampleKit)\.csproj$' } |
              ForEach-Object { [IO.Path]::GetFileNameWithoutExtension($_) } |
              Sort-Object -Unique)
          # **一覧が空なら止める**: `git ls-files` はチェックアウトが無いと空を返すため、
          # そのまま進めると全パッケージを「想定外」と誤判定する（実測 2026-11-03）。
          if ($expected.Count -eq 0) { throw '検証の対象（*.csproj）を取得できません（チェックアウトを確認してください）。' }
          $actual = @(Get-ChildItem -Path 'artifacts' -Recurse -File -Filter '*.nupkg' |
              ForEach-Object {
                if ($_.BaseName -notmatch '^(?<id>.+?)\.(?<v>\d+\.\d+\.\d+)$') { $issues.Add("名前から版を判定できない: $($_.Name)"); return }
                if ($Matches['v'] -ne $env:VERSION) { $issues.Add("版が $($env:VERSION) ではない: $($_.Name)"); return }
                $Matches['id']
              } | Sort-Object -Unique)

          foreach ($id in $expected) { if ($actual -notcontains $id) { $issues.Add("パッケージが無い: $id") } }
          foreach ($id in $actual) { if ($expected -notcontains $id) { $issues.Add("想定外のパッケージ: $id") } }

          # 同封物（XML ドキュメント）を確かめる（名前と版だけでは中身を保証できない）
          foreach ($package in @(Get-ChildItem -Path 'artifacts' -Recurse -File -Filter '*.nupkg')) {
            $zip = [IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $names = @($zip.Entries | ForEach-Object { $_.FullName })
              if (-not ($names | Where-Object { $_ -like 'lib/*/*.xml' })) { $issues.Add("XML ドキュメントが無い: $($package.Name)") }
              if (-not ($names | Where-Object { $_ -eq 'README.md' })) { $issues.Add("README.md が無い: $($package.Name)") }
            }
            finally { $zip.Dispose() }
          }

          if ($issues.Count -gt 0) {
            $issues | Select-Object -First 20 | ForEach-Object { Write-Host "::error::$_" }
            throw "配布物の検証に失敗しました（$($issues.Count) 件）"
          }
          Write-Host "配布物の検証: $($actual.Count) 件（版 $($env:VERSION)）"

      # 既に同じ版がある場合は「公開済み」として扱う（nuget.org の版は不変であり、上書きは拒否される）。
      # **シンボル パッケージ（.snupkg）は明示的に送らない**: `dotnet nuget push <nupkg>` が同じフォルダの
      # `.snupkg` を自動で送るため、送ると 409（既に検証待ちの複製がある）で失敗する（実測 2026-10-26）。
      - name: 公開
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'https://api.nuget.org/v3/index.json'
          $flat = 'https://api.nuget.org/v3-flatcontainer'
          $published = 0
          $skipped = 0

          foreach ($package in @(Get-ChildItem -Path 'artifacts' -Recurse -File -Filter '*.nupkg' | Sort-Object Name)) {
            # ファイル名から PackageId と版を取り出す（<id>.<version>.nupkg）
            if ($package.BaseName -notmatch '^(?<id>.+?)\.(?<v>\d+\.\d+\.\d+)$') {
              throw "パッケージ名から版を判定できません: $($package.Name)"
            }
            $id = $Matches['id']
            $version = $Matches['v']
            $url = "$flat/$($id.ToLowerInvariant())/$version/$($id.ToLowerInvariant()).$version.nupkg"

            $exists = $false
            try {
              $head = Invoke-WebRequest -Uri $url -Method Head -ErrorAction Stop
              $exists = $head.StatusCode -eq 200
            }
            catch { $exists = $false }

            if ($exists) {
              Write-Host "公開済み（版は不変。 上書きしない）: $id $version"
              $skipped += 1
              continue
            }

            & dotnet nuget push $package.FullName --source $source --api-key $env:NUGET_API_KEY
            if ($LASTEXITCODE -ne 0) { throw "push が失敗しました: $($package.Name)" }
            $published += 1
          }

          Write-Host "公開: $published 件 / 公開済みのため省略: $skipped 件"

  # ────────────────────────────────────────────────────────────
  # 4. タグと GitHub Release（公開が成功した後にだけ実行する）
  # ────────────────────────────────────────────────────────────
  tag:
    needs: [verify, publish]
    if: needs.verify.outputs.mode == 'release' && needs.verify.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # dry-run の実行の成果物を取得する
      actions: read
      # 成果物の由来（provenance）を証明する（署名は GitHub の OIDC で行う）
      id-token: write
      attestations: write
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 公開したパッケージと SBOM を 1 つのフォルダへ集約する（どちらも dry-run が作った成果物）
      - name: 成果物をダウンロード（dry-run の実行から）
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
          run-id: ${{ needs.verify.outputs.dryRunId }}
          github-token: ${{ github.token }}

      # **由来の証明**（どのワークフロー・どのコミットが作ったかを検証できるようにする）。
      # 公開した版は取り消せないため、後から出所を確かめられる状態にする（規則は .github/RELEASE.md）。
      - name: 由来を証明
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'assets/**/*.nupkg'

      # タグは 1 本（`v<版>`）、Release も 1 件（タグはワークフローだけが作る）
      - name: タグと Release を作成
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOLUTIONS: ${{ needs.verify.outputs.solutions }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'

          # 公開したソリューション（製品名）を列挙する。 パッケージ ID は製品名で始まるため、
          # どの配布物がこの版に含まれるかが分かる。
          $products = @(ConvertFrom-Json $env:SOLUTIONS | ForEach-Object { $_.product })

          # ソリューションごとの SBOM をすべて添付する（名前は generateSbom.ps1 が決める）
          $sboms = @(Get-ChildItem -Path 'assets' -File -Filter '*.sbom.cdx.json')
          if ($sboms.Count -eq 0) { throw 'SBOM がありません（assets/*.sbom.cdx.json）' }

          $notes = @(
            "公開したパッケージ（すべて v$($env:VERSION)）:"
            ($products | ForEach-Object { "- $_" })
            ''
            "一覧: https://www.nuget.org/profiles/tomokuni"
          ) -join "`n"

          & gh release create $env:TAG --target $env:SHA --title "v$($env:VERSION)" --notes $notes --latest @($sboms.FullName)
          if ($LASTEXITCODE -ne 0) { throw "タグと Release の作成が失敗しました: $($env:TAG)" }
          Write-Host "作成しました: $($env:TAG)（添付: $($sboms.Count) 件）"
