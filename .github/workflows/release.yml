name: release

# タグ（`v<版>`）を打ったときにパッケージを作り、成果物として残す。
# 版の値は `Directory.Build.props` の表が単一所有する（タグの文字列は印であり、版の所有者ではない）。
# nuget.org への公開はこのワークフローでは行わない（公開の手順はリポジトリの運用で決める）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    # Win32 / WIC を呼ぶ層を含むため Windows を要求する。
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # 版を上げ、ローカル フィード（`.nupkg/`）へ出力する。
      - name: Pack packages
        shell: pwsh
        run: ./buildScript/pack.ps1

      # 作り直したパッケージで検証する（タグの指す木が合格しない状態で配布物を残さない）。
      - name: Verify
        shell: pwsh
        run: ./buildScript/verify.ps1 -Configuration Release -NoRestore

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            .nupkg/*.nupkg
            .nupkg/*.snupkg
          if-no-files-found: error
