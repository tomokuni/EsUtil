# リリース ワークフロー（手動実行のみ）
#
# 手順の全体:
#   1. mode=dry-run で実行する（配布物の作成と検証だけ。 タグも公開もしない）
#   2. 問題が無ければ mode=release で実行する
#      （**同じコミットの dry-run が成功していることを前提**にし、満たさなければ中止する）
#   3. release は「承認（environment: release）」→「公開」→「タグ付け」の順に進む
#
# 設計の要点:
#   - **版は人が Directory.Build.props の VersionPrefix へ書いてコミットしておく**（自動採番しない）。
#     入力 `version` は確認用であり、ツリーの値と一致しなければ失敗する。
#   - **公開が成功した後にだけタグを打つ**（公開できなかった版にタグを残さない）。
#   - **タグはグループ別**（`EsUtil/v0.2.0` / `EsUtil.Ui.<UI>/v0.1.0`）。
#   - **公開は Trusted Publishing**（OIDC で短命の API キーを取得する。 長期の API キーを持たない）。
#     ポリシーは「リポジトリ + ワークフロー ファイル + environment: release」に紐づける。
#   - **変更のあったグループだけを公開する**（前回のグループ別タグからの差分で決める）。
#   - 公開する版にローカル識別子（`-`）を含めない。
#   - **実行できるブランチはモードで変わる**（dry-run は main / dev、公開は main のみ）。
#     一覧は .github/release-config.json が単一所有する（開発〜dry-run の確認は dev で行う）。
#
# 詳細な合否基準は .github/検証手順.md §9、版の規則は .github/ビルド設定規約.md §4 が持つ。
name: Release

run-name: ${{ inputs.mode == 'dry-run' && 'DryRun' || 'Release' }} ${{ github.ref_name }} ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run（作成と検証のみ）/ release（公開とタグ付け）'
        required: true
        type: choice
        options: [dry-run, release]
        default: dry-run
      version:
        description: '任意: 公開する版（Directory.Build.props の VersionPrefix と一致しなければ失敗します）'
        required: false
        type: string

# リリース処理は同時に 1 つだけ実行する
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. 前提検証（版・対象グループ・dry-run の成功）
  # ────────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # dry-run の実行結果の参照
      actions: read
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5
        with:
          # グループ別タグとの差分を取るため全履歴を取得する
          fetch-depth: 0

      - name: 実行ブランチを検証する
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
          BRANCH: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          # 許可ブランチの所有者は .github/release-config.json（ワークフローへ書き写さない）
          $config = Get-Content '.github/release-config.json' -Raw | ConvertFrom-Json
          $key = if ($env:MODE -eq 'release') { 'releaseBranches' } else { 'dryRunBranches' }
          $allowed = @($config.$key)

          if ($allowed.Count -eq 0) { throw ".github/release-config.json の $key が空です" }
          if ($allowed -notcontains $env:BRANCH) {
            throw "このブランチ（$($env:BRANCH)）では mode=$($env:MODE) を実行できません（許可: $($allowed -join ', ')。 .github/release-config.json）"
          }

          Write-Host "実行ブランチ: $($env:BRANCH)（mode=$($env:MODE)）"

      - name: 版と対象グループを決める
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
          INPUT_VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'

          $solutions = [ordered]@{
            'EsUtil'               = 'EsUtil/EsUtil.slnx'
            'EsUtil.Ui.AvaloniaUI' = 'EsUtil.Ui.AvaloniaUI/EsUtil.Ui.AvaloniaUI.slnx'
            'EsUtil.Ui.MewUI'      = 'EsUtil.Ui.MewUI/EsUtil.Ui.MewUI.slnx'
            'EsUtil.Ui.WinUI3'     = 'EsUtil.Ui.WinUI3/EsUtil.Ui.WinUI3.slnx'
            'EsUtil.Ui.WinForms'   = 'EsUtil.Ui.WinForms/EsUtil.Ui.WinForms.slnx'
          }

          $props = [IO.File]::ReadAllText('Directory.Build.props', [Text.UTF8Encoding]::new($false))

          function Get-Prefix([string]$group) {
            $key = ($group -replace '\.', '_') + '_VersionPrefix'
            $m = [regex]::Match($props, ("<{0}>([^<]+)</{0}>" -f [regex]::Escape($key)))
            if (-not $m.Success) { throw "Directory.Build.props に $key がありません" }
            return $m.Groups[1].Value.Trim()
          }

          # 公開する版にローカル識別子を含めない（取り消せない公開を守る）
          $groups = [System.Collections.Generic.List[object]]::new()
          foreach ($group in $solutions.Keys) {
            $version = Get-Prefix $group
            if ($version -match '-') { throw "$group の VersionPrefix にローカル識別子が含まれています: $version" }

            if ($env:INPUT_VERSION -and $env:INPUT_VERSION.Trim() -ne $version) {
              throw "入力 $($env:INPUT_VERSION) が $group の VersionPrefix $version と一致しません（版はコミット済みの値を使います）"
            }

            # 前回のグループ別タグから変わったかを差分で決める（タグが無ければ初回＝対象）
            $tag = "$group/v$version"
            $lastTag = @(git tag --list "$group/v*" --sort=-v:refname) | Select-Object -First 1

            # 同じ版は再リリースできない（公開済みの版は不変）。 **dry-run では止めない**。
            # 版を上げていないだけの状態でも「それ以外の条件が通る」ことを確認できるようにする
            # （その確認が dry-run の役目。 公開（release）では失敗させる）。
            $alreadyReleased = $lastTag -eq $tag
            if ($alreadyReleased) {
              if ($env:MODE -ne 'dry-run') {
                throw "タグ $tag は既に存在します（同じ版を再リリースできません）。版を上げてコミットしてください。"
              }
              Write-Host "::warning::$tag は既に存在します。release モードでは失敗します（版を上げてください）。 dry-run のため続行します。"
            }

            $changed = if ($lastTag) {
              @(git diff --name-only "$lastTag...$($env:SHA)" -- $group).Count -gt 0
            }
            else { $true }

            if ($changed) {
              $groups.Add([ordered]@{ group = $group; version = $version; tag = $tag; solution = $solutions[$group] })
            }
            elseif ($alreadyReleased) {
              Write-Host "   $group : 版 $version は公開済みで、タグからの変更もありません（対象外）"
            }
          }

          if ($groups.Count -eq 0) {
            Write-Host 'リリースするグループがありません（前回のタグから変更がありません）。'
          }

          # release は「同じコミットの dry-run が成功している」ことを前提にする
          if ($env:MODE -eq 'release') {
            # displayTitle は run-name（`DryRun <ブランチ> <SHA>` / `Release …`）である。
            # name はワークフロー名（Release）なので判定に使えない。
            $runs = @(gh run list --repo $env:REPO --workflow release.yml --commit $env:SHA --limit 50 --json displayTitle,conclusion,headSha | ConvertFrom-Json)
            $ok = @($runs | Where-Object { $_.displayTitle -like 'DryRun*' -and $_.conclusion -eq 'success' }).Count -gt 0
            if (-not $ok) {
              throw "このコミット（$env:SHA）の dry-run の成功実行がありません。先に mode=dry-run で実行してください。"
            }
          }

          $json = $groups | ConvertTo-Json -Compress -AsArray
          "groups=$json" >> $env:GITHUB_OUTPUT
          "count=$($groups.Count)" >> $env:GITHUB_OUTPUT
          Write-Host "対象: $json"

  # ────────────────────────────────────────────────────────────
  # 2. 配布物の作成（dry-run でも release でも実行する）
  # ────────────────────────────────────────────────────────────
  pack:
    needs: verify
    if: needs.verify.outputs.count != '0'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5

      - name: NuGet をキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # 版はコミット済みの VersionPrefix を使う（ワークフローで書き換えない）。
      # グループ（= ソリューション）ごとに pack する。 公開する版にはローカル識別子を付けない。
      - name: パッケージを作成
        shell: pwsh
        env:
          GROUPS: ${{ needs.verify.outputs.groups }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($item in @(ConvertFrom-Json $env:GROUPS)) {
            $out = Join-Path 'artifacts' ($item.group -replace '\.', '-')
            & dotnet pack $item.solution -c Release -o $out --nologo
            if ($LASTEXITCODE -ne 0) { throw "pack が失敗しました: $($item.group)" }
          }
          Get-ChildItem -Path 'artifacts' -Recurse -File | ForEach-Object { $_.FullName }

      - name: 配布物を保管
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            artifacts/**/*.nupkg
            artifacts/**/*.snupkg
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────
  # 3. 公開（release のみ。 承認を要求する）
  # ────────────────────────────────────────────────────────────
  publish:
    needs: [verify, pack]
    if: inputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 承認されたジョブだけが公開できる（Trusted Publishing のポリシーもこの環境に紐づける）
    environment: release
    permissions:
      contents: read
      # OIDC で短命の NuGet API キーを取得する
      id-token: write
    steps:
      - name: 配布物を取得
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      # 短命の API キーを取得する（1 時間有効。 1 トークン = 1 キー。 **push の直前に取得する**）
      - name: NuGet の API キーを取得
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # 既に同じ版がある場合は「公開済み」として扱う（nuget.org の版は不変であり、上書きは拒否される）。
      # **シンボル パッケージ（.snupkg）は明示的に送らない**: `dotnet nuget push <nupkg>` が同じフォルダの
      # `.snupkg` を自動で送るため、送ると 409（既に検証待ちの複製がある）で失敗する（実測 2026-10-26）。
      - name: 公開
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'https://api.nuget.org/v3/index.json'
          $flat = 'https://api.nuget.org/v3-flatcontainer'
          $published = 0
          $skipped = 0

          foreach ($package in @(Get-ChildItem -Path 'artifacts' -Recurse -File -Filter '*.nupkg' | Sort-Object Name)) {
            # ファイル名から PackageId と版を取り出す（<id>.<version>.nupkg）
            if ($package.BaseName -notmatch '^(?<id>.+?)\.(?<v>\d+\.\d+\.\d+)$') {
              throw "パッケージ名から版を判定できません: $($package.Name)"
            }
            $id = $Matches['id']
            $version = $Matches['v']
            $url = "$flat/$($id.ToLowerInvariant())/$version/$($id.ToLowerInvariant()).$version.nupkg"

            $exists = $false
            try {
              $head = Invoke-WebRequest -Uri $url -Method Head -ErrorAction Stop
              $exists = $head.StatusCode -eq 200
            }
            catch { $exists = $false }

            if ($exists) {
              Write-Host "公開済み（版は不変。 上書きしない）: $id $version"
              $skipped += 1
              continue
            }

            & dotnet nuget push $package.FullName --source $source --api-key $env:NUGET_API_KEY
            if ($LASTEXITCODE -ne 0) { throw "push が失敗しました: $($package.Name)" }
            $published += 1
          }

          Write-Host "公開: $published 件 / 公開済みのため省略: $skipped 件"

  # ────────────────────────────────────────────────────────────
  # 4. タグと GitHub Release（公開が成功した後にだけ実行する）
  # ────────────────────────────────────────────────────────────
  tag:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # グループ別にタグと Release を作る（タグはワークフローだけが作る）
      - name: タグと Release を作成
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROUPS: ${{ needs.verify.outputs.groups }}
          SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($item in @(ConvertFrom-Json $env:GROUPS)) {
            # グループ別の Release にする。 「Latest」は共通基盤（EsUtil）の Release だけに付け、
            # ほかのグループは付けない（Latest は 1 つしか選べず、UI の版が最新に見えると誤解を招く）。
            $notes = "公開したパッケージ: $($item.group) v$($item.version)"
            $latest = if ($item.group -eq 'EsUtil') { '--latest' } else { '--latest=false' }
            & gh release create $item.tag --target $env:SHA --title "$($item.group) v$($item.version)" --notes $notes $latest
            if ($LASTEXITCODE -ne 0) { throw "タグと Release の作成が失敗しました: $($item.tag)" }
            Write-Host "作成しました: $($item.tag)"
          }
