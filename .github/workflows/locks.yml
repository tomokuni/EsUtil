# ロックファイル（packages.lock.json）の自動更新
#
# 実行契機:
#   main 向け Pull Request … 版を上げると `packages.lock.json` の `ProjectReference` の版が変わるため、
#                            古いままだと CI が `NU1004`（lock が古い）で失敗する。 このワークフローが
#                            `.github/scripts/updateLocks.ps1` を実行し、**差分があれば Pull Request の
#                            ブランチ（`dev`）へ自動でコミット**する（開発者の手作業をなくす）。
#                            **lock が変わりうるファイルを触ったときだけ実行する**（`paths`）。
#                            以前は文書だけの Pull Request でも毎回 1 分 50 秒を使っていた（実測 2026-11-06:
#                            ジョブ 110 秒 = チェックアウト 9 / lock の更新 87 / 後処理 8）。
#                            このジョブは**必須チェックではない**（ruleset が要求するのは `ci` だけ）ため、
#                            対象外の Pull Request で走らなくてもマージは妨げられない。
#
# 設計の要点:
#   - **同じリポジトリの Pull Request だけ**を対象にする（fork のブランチへは push できない）。
#   - **自動コミットの本文に印（`[skip locks]`）を入れ**、次の実行で何もしない（無限ループを防ぐ）。
#   - lock を持つのは**配布するプロジェクト（src）だけ**である（テスト・サンプルは持たない。 版を上げるたびに
#     機械的な差分だけが大量に出るため。 規則は .github/ビルド設定規約.md §8）。
#   - 差分の判定と更新は .github/scripts/updateLocks.ps1 が単一所有する（本ファイルは呼ぶだけ）。
#   - 失敗しても Pull Request は止めない（lock が古いままなら build.yml が `NU1004` で落ちる。
#     ここで止めると「なぜ落ちたか」が分かりにくくなる）。
name: Locks

on:
  pull_request:
    branches: [main]
    # **lock が変わりうるファイルだけ**を対象にする（`Directory.Build.props` の版・パッケージの版・
    # 参照・対象フレームワークが lock の中身を決める。 規則は .github/ビルド設定規約.md §8）。
    # ここに挙げたファイルを触らない Pull Request では、ジョブを起動しない（実行時間 0 秒）。
    paths:
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
      - '**/*.csproj'
      - '**/packages.lock.json'
      - '.github/scripts/updateLocks.ps1'
      - '.github/workflows/locks.yml'
  workflow_dispatch:

permissions:
  contents: read

# 同じ Pull Request で同時に走らせない
concurrency:
  group: locks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  update:
    # fork の Pull Request は push できないため対象外（その場合は手元で updateLocks.ps1 を実行する）
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      # 自動コミットを Pull Request のブランチへ push する
      contents: write
    steps:
      # **Pull Request の head ブランチ**を取得する（`github.ref` は `refs/pull/<番号>/merge` であり push 先ではない）
      - name: チェックアウト
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          # lock の更新は「前回のコミット」との差分ではないが、通常のチェックアウトで足りる
          fetch-depth: 0

      # 前回の自動コミットで走った実行は何もしない（無限ループを防ぐ）
      - name: 自動コミットの印を確認する
        id: guard
        shell: pwsh
        run: |
          # 印は**本文の 1 行**として入れる（1 行目は日本語の要約にする）。 そのため `%B`（件名 + 本文）で判定する。
          # **`-like` は使わない**: PowerShell のワイルドカードは `[...]` を文字クラスとして扱うため、
          # `-like '*[skip locks]*'` は「s/k/i/p/空白/l/o/c のどれか 1 文字」に一致してしまう（実測）。
          # 行単位で一致を見る（本文中で印に言及しただけのコミットを誤って飛ばさない）。
          $lines = @((git log -1 --format=%B) -split "`r?`n" | ForEach-Object { $_.Trim() })
          if ($lines -contains '[skip locks]') {
            Write-Host "前回のコミットが自動更新のため省略します: $((git log -1 --format=%s).Trim())"
            "skip=true" >> $env:GITHUB_OUTPUT
          }
          else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      # 復元済みのパッケージを使い回す（実測 2026-11-06: lock の更新 87 秒の大半が復元）。
      # **キーに lock を含めない**: 版を上げると lock は必ず変わるため、含めると必ず外れる。
      # 版を上げただけ（パッケージの集合が同じ）のときは当たる。
      # 省略する実行（自動コミットの直後）では復元もしないため、印の判定より後に置く。
      - name: NuGet をキャッシュ
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-locks-${{ hashFiles('Directory.Packages.props', 'NuGet.config', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-locks-
            nuget-${{ runner.os }}-repo-
            nuget-${{ runner.os }}-

      - name: lock を更新
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          & pwsh -NoProfile -File .github/scripts/updateLocks.ps1
          if ($LASTEXITCODE -ne 0) { throw "lock の更新に失敗しました（exit $LASTEXITCODE）" }

      - name: 差分があれば自動コミット
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $changed = @(git status --porcelain -- '*/packages.lock.json' 'packages.lock.json')
          if ($changed.Count -eq 0) {
            Write-Host 'lock は最新です（コミットしません）。'
            exit 0
          }

          $changed | ForEach-Object { Write-Host "  $_" }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*/packages.lock.json' 'packages.lock.json'
          # 印（`[skip locks]`）を本文に入れ、次の実行でこのコミットを飛ばす
          git commit -m 'lock を更新する（版の変更に追随）' -m '[skip locks]'
          git push origin "HEAD:$env:BRANCH"
          Write-Host "自動コミットを push しました: $env:BRANCH"
